<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="theme-color" content="#4A1A1F">
<link rel="apple-touch-icon" href="https://caceresn999-ops.github.io/tally/tally-touch-v3.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<script>
  // Desde el ícono (?go=1) se entra directo a la app; abierta a mano, la página se queda para poder agregar el ícono.
  var APP = 'https://script.google.com/macros/s/AKfycbwauG7QLQ8_6BHFnVjspBmtjN3UE30G7b8GChf4G-onTsmdefLtCOC6JJJXYiMY3IM/exec';
  // Solo redirige con la página visible: cuando iOS la carga por detrás para leer el ícono, no se va a Google.
  var GO = /[?&]go=1(&|$)/.test(location.search), salio = false;
  function irApp() {
    if (!GO || salio || document.visibilityState !== 'visible') return;
    salio = true;
    setTimeout(function () { location.replace(APP); }, 300);
  }
  document.addEventListener('visibilitychange', irApp);
  window.addEventListener('pageshow', irApp);
  irApp();
</script>
<style>
  :root { color-scheme: dark; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: #4A1A1F; color: #F3D9A4;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 48px 24px; box-sizing: border-box; text-align: center;
  }
  .firma { font-family: ui-serif, "New York", Georgia, serif; font-size: 34px; letter-spacing: -0.01em; margin: 0; }
  ol { text-align: left; max-width: 300px; margin: 8px 0 0; padding-left: 22px; line-height: 1.55; font-size: 15px; color: #EADCC4; }
  li + li { margin-top: 6px; }
  b { color: #F3D9A4; }
  a {
    color: #4A1A1F; background: #F3D9A4; text-decoration: none; font-weight: 600;
    padding: 14px 28px; border-radius: 12px; min-height: 44px; box-sizing: border-box; display: inline-block;
  }
  a:focus-visible { outline: 3px solid #F3D9A4; outline-offset: 3px; }
</style>
</head>
<body>
  <img src="icon-192.png" width="96" height="96" alt="" style="border-radius:22.5%">
  <p class="firma">Tally</p>
  <a id="abrir" href="#">Abrir Tally</a>
  <ol>
    <li>Toca <b>Compartir</b> en Safari.</li>
    <li>Elige <b>Agregar a pantalla de inicio</b>.</li>
    <li>Desactiva <b>Abrir como app web</b> y toca <b>Agregar</b>.</li>
  </ol>
<script>
  document.getElementById('abrir').href = APP;
  // El ícono guarda esta dirección: al abrirlo desde la pantalla de inicio entra directo a Tally.
  if (!/[?&]go=1(&|$)/.test(location.search)) history.replaceState(null, '', location.pathname + '?go=1');
</script>
</body>
</html>
